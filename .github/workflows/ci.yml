name: Food Intelligence CI

on:
  push:
    branches: ["main", "phase*/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Compile source
        run: python -m compileall -q src
      - name: Run Phase 0 audit
        run: python scripts/phase0_audit.py --output phase0-audit.json
      - name: Run tests
        run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          python -m food_intelligence.cli ingest-status
          python -m food_intelligence.cli benchmark
          python -m food_intelligence.cli tasks
          python -m food_intelligence.cli evaluate
